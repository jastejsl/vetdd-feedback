name: Notify VetDD on Feedback Merge

on:
  push:
    branches:
      - main
    paths:
      - 'diseases/disease-files/**'
      - 'syndromes/syndrome-files/**'

jobs:
  dispatch-reverse-sync:
    name: Trigger Reverse-Sync in VetDD
    runs-on: ubuntu-latest

    steps:
      - name: Send repository_dispatch event to VetDD
        env:
          VETDD_SYNC_PAT: ${{ secrets.VETDD_SYNC_PAT }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${VETDD_SYNC_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jastejsl/vetdd/dispatches \
            -d '{"event_type":"feedback-merged","client_payload":{"ref":"${{ github.ref }}","sha":"${{ github.sha }}"}}'
